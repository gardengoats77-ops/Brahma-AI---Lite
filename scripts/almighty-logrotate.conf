# logrotate rule for Almighty AI startup log on the Pi 5
# Prevents the 2.6MB startup.log from growing unbounded (disk was 87% full)
#Installed via: sudo install -m 644 scripts/almighty-logrotate.conf /etc/logrotate.d/almighty

/home/star-server/Brahma-AI---Lite/AlmightyAI/startup.log
/home/star-server/Brahma-AI---Lite/BrahmaAI/startup.log
{
    weekly
    rotate 4
    size 5M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su star-server star-server
}
