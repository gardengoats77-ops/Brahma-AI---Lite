                        setNavStatus({ type: 'error', message: 'Destination not geocoded yet — run Optimize Route first or go online to geocode it.' });
                        return;
                    }
                    let origin = originOverride || gpsPos;
                    if (!origin) origin = destCoords;
                    setNavLoading(true);
                    setNavStatus({ type: 'info', message: 'Routing…' });
                    const route = await fetchOsrmRoute(origin, destCoords);
                    setRouteData(route);
                    setInstructions(buildInstructions(route));
                    setCurrentStep(1);
                    setNavJob(job);
                    setNavLoading(false);
                    if (route.offline) {
                        setNavStatus({ type: 'error', message: 'Offline — using straight-line estimate. Route cache works after one online fetch.' });
                    } else if (route.cached) {
                        setNavStatus({ type: 'success', message: 'Loaded cached route (offline-ready).' });
                    } else {
                        setNavStatus({ type: 'success', message: 'Route ready — turn-by-turn cached for offline.' });
                    }
                }, [geocodeCache, gpsPos]);

                // Auto-build route to the first stop when the map is ready (retries when stops change)
                useEffect(() => {
                    if (!mapReady || routeList.length === 0) return;
                    if (!navJob) buildRoute(routeList[0], null);
                    // eslint-disable-next-line react-hooks/exhaustive-deps
                }, [mapReady, routeList.length]);

                const goToNextStop = () => {
                    if (!destJob) return;
                    const current = destJob;
                    const currentIdx = routeList.findIndex(r => r.id === current.id);
                    const nextJob = currentIdx >= 0 ? routeList[currentIdx + 1] : null;
                    const currentCoords = geocodeCache[current.address.toLowerCase().trim()];
                    // mark current stop done (removes it from the active route)
                    completeJob(current);
                    setRouteData(null);
                    setInstructions([]);
                    if (nextJob) {
                        setNavStatus({ type: 'info', message: 'Marked done — routing to next stop…' });
                        buildRoute(nextJob, currentCoords || gpsPos);
                    } else {
                        setNavJob(null);
                        setNavStatus({ type: 'success', message: '🎉 All stops complete!' });
                    }
                };

                const saveEndpoint = () => {
                    setOsrmEndpoint(endpoint);
                    setShowEndpoint(false);
                    setNavStatus({ type: 'info', message: 'Routing server updated. Rebuild the route.' });
                };

                const totalDist = routeData ? fmtDistance(routeData.distance) : '—';
                const totalDur = routeData ? fmtDuration(routeData.duration) : '—';
                const nextInst = instructions.length > 1 ? instructions[Math.min(currentStep, instructions.length - 1)] : null;

                return (
                    <div className="min-h-screen bg-slate-950 text-white p-2 flex flex-col gap-3">
                        {/* Header */}
                        <div className="flex items-center justify-between px-1">
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setNavMode(false)}
                                    className="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 text-lg font-bold active:bg-slate-800"
                                >
                                    ‹
                                </button>
                                <div>
                                    <p className="text-xs font-bold text-sky-400 uppercase tracking-wide">Navigation</p>
                                    <p className="text-[10px] text-slate-500">{destJob ? destJob.address : 'No stops on route'}</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-[10px] text-slate-500 uppercase">ETA</p>
                                <p className="text-lg font-black font-mono text-emerald-400 leading-tight">{totalDur}</p>
                                <p className="text-[10px] text-slate-500">{totalDist}</p>
                            </div>
                        </div>

                        {/* Map */}
                        <div className="relative w-full h-[38vh] rounded-2xl overflow-hidden border border-slate-800">
                            <div ref={mapContainerRef} className="absolute inset-0 z-0"></div>
                            {!mapReady && (
                                <div className="absolute inset-0 flex items-center justify-center bg-slate-950 z-10">
                                    <p className="text-sm text-slate-400">Loading map…</p>
                                </div>
                            )}
                            {navLoading && (
                                <div className="absolute top-2 left-2 z-10 bg-slate-900/90 rounded-md px-2.5 py-1.5 text-[10px] text-sky-300 border border-sky-500/40">
                                    <span className="inline-block animate-spin mr-1">⟳</span> Routing…
                                </div>
                            )}
                        </div>

                        {/* Status bar */}
                        {navStatus && (
                            <div className={`px-3 py-2 rounded-xl text-xs font-medium border ${navStatus.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : navStatus.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-blue-500/10 border-blue-500/30 text-blue-400'}`}>
                                {navStatus.message}
                            </div>
                        )}

                        {/* Next instruction — big */}
                        {nextInst && (
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center gap-4">
                                <span className="text-4xl text-sky-400 font-black">{nextInst.icon}</span>
                                <div className="flex-1 min-w-0">
                                    <p className="text-base font-black leading-tight">{nextInst.text}{nextInst.road ? ` on ${nextInst.road}` : ''}</p>
                                    <p className="text-xs text-slate-400 mt-1">{fmtDistance(nextInst.distance)} • {fmtDuration(nextInst.duration)}</p>
                                </div>
                            </div>
                        )}

                        {/* Step list */}
                        <div className="flex-1 min-h-0 overflow-y-auto space-y-1 pr-1">
                            {instructions.map((inst, i) => (
                                <button
                                    key={i}
                                    onClick={() => setCurrentStep(i)}
                                    className={`w-full flex items-center gap-3 p-2.5 rounded-xl text-left border transition ${i === currentStep ? 'bg-sky-500/15 border-sky-500/50' : 'bg-slate-900 border-slate-800 active:bg-slate-800'}`}
                                >
                                    <span className={`w-7 h-7 flex items-center justify-center rounded-lg text-sm font-bold ${i === currentStep ? 'bg-sky-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>{inst.icon}</span>
                                    <div className="flex-1 min-w-0">
                                        <p className={`text-xs font-semibold ${i === currentStep ? 'text-sky-300' : 'text-slate-200'}`}>{inst.text}{inst.road ? ` — ${inst.road}` : ''}</p>
                                    </div>
                                    <span className="text-[10px] font-mono text-slate-500 shrink-0">{fmtDistance(inst.distance)}</span>
                                </button>
                            ))}
                            {instructions.length === 0 && !navLoading && (
                                <div className="text-center py-8">
                                    <p className="text-xs text-slate-500">{routeData && routeData.offline ? 'Offline — no turn instructions available.' : 'Build a route to see turn-by-turn instructions.'}</p>
                                </div>
                            )}
                        </div>

                        {/* Controls */}
                        <div className="space-y-2">
                            <div className="flex gap-2">
                                <button
                                    onClick={() => { setNavMode(false); setRightTab('map'); }}
                                    className="flex-1 py-3.5 rounded-xl bg-slate-900 border border-slate-800 text-sm font-bold text-slate-300 active:bg-slate-800"
                                >
                                    🗺 Full Map
                                </button>
                                <button
                                    onClick={() => setShowEndpoint(v => !v)}
                                    className="px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-800 text-sm font-bold text-slate-300 active:bg-slate-800"
                                    title="Routing server settings"
                                >
                                    ⚙
                                </button>
                            </div>
                            {showEndpoint && (
                                <div className="p-3 bg-slate-900 border border-slate-800 rounded-xl">
                                    <p className="text-[10px] text-slate-400 mb-2">OSRM routing server (for self-hosted offline routing, e.g. localhost:5000 on your network)</p>
                                    <div className="flex gap-2">
                                        <input
                                            value={endpoint}
                                            onChange={e => setEndpoint(e.target.value)}
                                            placeholder={OSRM_DEFAULT_ENDPOINT}
                                            className="flex-1 px-2.5 py-2 rounded-lg bg-slate-950 border border-slate-700 text-xs focus:outline-none focus:border-sky-500"
                                        />
                                        <button onClick={saveEndpoint} className="px-3 py-2 rounded-lg bg-sky-600 text-white text-xs font-bold">Save</button>
                                    </div>
                                </div>
                            )}
                            <div className="flex gap-2">
                                <button
                                    onClick={() => buildRoute(destJob || routeList[0], null)}
                                    disabled={routeList.length === 0}
                                    className="flex-1 py-3.5 rounded-xl bg-slate-900 border border-slate-800 text-sm font-bold text-slate-300 active:bg-slate-800 disabled:opacity-40"
                                >
                                    ↻ Rebuild
                                </button>
                                <button
                                    onClick={goToNextStop}
                                    disabled={!destJob}
                                    className={`flex-1 py-3.5 rounded-xl text-sm font-black border-2 transition ${!destJob ? 'bg-slate-800 border-slate-800 text-slate-600' : 'bg-emerald-600 border-emerald-500 text-white active:scale-[0.98]'}`}
                                >
                                    {routeList.length === 0 ? 'No Stops' : isLastStop ? '✓ Finish Route' : '✓ Done — Next Stop'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // WatchView component — compact UI with huge touch targets for smartwatches
            const WatchView = () => {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });

                // Route progress tracking (per watch session)
                const [doneCount, setDoneCount] = useState(0);
                const [justDone, setJustDone] = useState(null);
                const doneTimerRef = useRef(null);
                const totalStops = doneCount + routeList.length;
                const progress = totalStops > 0 ? Math.min(doneCount / totalStops, 1) : 0;
                const pct = Math.round(progress * 100);
                const allDone = doneCount > 0 && routeList.length === 0;

                useEffect(() => () => {
                    if (doneTimerRef.current) clearTimeout(doneTimerRef.current);
                }, []);

                // Complete a stop: removes it from the route (auto-advance) + counts it
                const watchComplete = (job) => {
                    completeJob(job);
                    setDoneCount(c => c + 1);
                    setJustDone(job.address);
                    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
                    if (doneTimerRef.current) clearTimeout(doneTimerRef.current);
                    doneTimerRef.current = setTimeout(() => setJustDone(null), 1600);
                };

                // Completion ring geometry
                const ringSize = 96, ringStroke = 10;
                const ringR = (ringSize - ringStroke) / 2;
                const ringC = 2 * Math.PI * ringR;
                const ringOffset = ringC - progress * ringC;

                return (
                    <div className="min-h-screen bg-slate-950 text-white p-2 flex flex-col gap-3" style={{ minWidth: 0 }}>
                        {/* Header */}
                        <div className="flex items-center justify-between px-1">
                            <div>
                                <p className="text-xs font-bold text-emerald-400 uppercase tracking-wide">Goats</p>
                                <p className="text-xl font-black leading-tight mt-0.5">{timeStr}</p>
                                <p className="text-[10px] text-slate-500">{dateStr}</p>
                            </div>
                            <div className="text-right">
                                <p className="text-[10px] text-slate-500 uppercase">Miles</p>
                                <p className="text-xl font-black font-mono text-emerald-400 leading-tight">{totalMileage.toFixed(1)}</p>
                                <p className="text-[10px] text-slate-500">${taxDeduction}</p>
                            </div>
                        </div>

                        {/* Progress ring widget */}
                        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 flex items-center gap-4">
                            <div className="relative shrink-0" style={{ width: ringSize, height: ringSize }}>
                                <svg width={ringSize} height={ringSize} viewBox={`0 0 ${ringSize} ${ringSize}`} className="-rotate-90">
                                    <circle cx={ringSize / 2} cy={ringSize / 2} r={ringR} fill="none" stroke="#1e293b" strokeWidth={ringStroke} />
                                    <circle
                                        cx={ringSize / 2} cy={ringSize / 2} r={ringR}
                                        fill="none" stroke="#10b981" strokeWidth={ringStroke} strokeLinecap="round"
                                        strokeDasharray={ringC} strokeDashoffset={ringOffset}
                                        className="transition-all duration-700 ease-out"
                                    />
                                </svg>
                                <div className="absolute inset-0 flex flex-col items-center justify-center">
                                    <p className="text-lg font-black leading-none">
                                        {doneCount}<span className="text-slate-500 text-sm">/{totalStops}</span>
                                    </p>
                                    <p className="text-[8px] text-slate-500 uppercase tracking-wide mt-0.5">{pct}%</p>
                                </div>
                            </div>
                            <div className="flex-1 min-w-0">
                                <p className="text-sm font-black leading-tight">
                                    {allDone ? '🎉 All stops done!' : `${doneCount} of ${totalStops} stops done`}
                                </p>
                                <p className="text-[10px] text-slate-400 mt-0.5">
                                    {allDone ? 'Great work today' : routeList.length === 0 ? 'Build a route to begin' : `${routeList.length} remaining`}
                                </p>
                                <div className="h-1.5 bg-slate-800 rounded-full mt-2 overflow-hidden">
                                    <div
                                        className="h-full bg-gradient-to-r from-emerald-600 to-emerald-400 rounded-full transition-all duration-700 ease-out"
                                        style={{ width: `${pct}%` }}
                                    ></div>
                                </div>
                            </div>
                        </div>

                        {/* Big tracking button */}
                        <button
                            onClick={toggleTracking}
                            className={`w-full py-5 rounded-2xl text-base font-black transition border-2 ${isTracking ? 'bg-red-500/20 text-red-400 border-red-500/60 animate-pulse' : 'bg-emerald-600 text-white border-emerald-500'}`}
                        >
                            {isTracking ? '■ STOP ROUTE' : '▶ START ROUTE'}
                        </button>

                        {/* Add due jobs */}
                        {dueCount > 0 && (
                            <button
                                onClick={addDueJobsToRoute}
                                className="w-full py-4 rounded-2xl bg-amber-500/20 text-amber-400 border-2 border-amber-500/50 font-black text-base"
                            >
                                + {dueCount} DUE JOBS
                            </button>
                        )}

                        {/* Just-done toast (auto-advance feedback) */}
                        {justDone && (
                            <div className="bg-emerald-600 rounded-2xl px-3 py-2.5 flex items-center gap-2">
                                <span className="text-lg">✓</span>
                                <div className="min-w-0">
                                    <p className="text-[9px] text-emerald-100 uppercase tracking-wide font-bold">Done — auto-advanced</p>
                                    <p className="text-[11px] font-bold truncate">{justDone}</p>
                                </div>
                            </div>
                        )}

                        {/* Current / next stop */}
                        {routeList.length === 0 ? (
                            <div className="flex-1 flex items-center justify-center">
                                <div className="text-center">
                                    <p className="text-sm font-bold text-slate-300">{allDone ? 'Route complete' : 'No stops'}</p>
                                    <p className="text-[10px] text-slate-500 mt-1">{allDone ? 'Everything on today\'s route is finished' : 'Add properties to build your route'}</p>
                                </div>
                            </div>
                        ) : (
                            <>
                                <div className="flex items-center justify-between px-1">
                                    <p className="text-[10px] text-slate-500 uppercase tracking-wide">Next stop</p>
                                    <p className="text-[10px] font-mono text-emerald-400">{routeList.length} left</p>
                                </div>
                                {routeList.slice(0, 2).map((job, idx) => {
                                    const isCurrent = idx === 0;
                                    return (
                                        <div key={job.id} className={`p-3 rounded-2xl border-2 transition ${isCurrent ? 'bg-emerald-950/40 border-emerald-500/60' : 'bg-slate-900 border-slate-800'}`}>
                                            <p className={`text-[10px] font-bold uppercase tracking-wide ${isCurrent ? 'text-emerald-400' : 'text-slate-500'}`}>
                                                {isCurrent ? '● Now' : '→ Up next'} — {job.service}
                                            </p>
                                            <p className="text-base font-black leading-tight mt-1">{job.address}</p>
                                            <div className="flex gap-2 mt-3">
                                                <button
                                                    onClick={() => watchComplete(job)}
                                                    className="flex-1 py-5 rounded-xl bg-emerald-600 text-white text-xl font-black active:bg-emerald-500 active:scale-95 transition"
                                                >
                                                    ✓ DONE
                                                </button>
                                                <button
                                                    onClick={() => toggleJobInRoute(job)}
                                                    className="px-4 py-5 rounded-xl bg-slate-800 text-slate-400 text-lg font-bold active:bg-slate-700 active:scale-95 transition"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </>
                        )}

                        {/* Small footer nav back to full app */}
                        <button
                            onClick={() => setWatchMode(false)}
                            className="w-full py-3 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-400 active:bg-slate-800"
                        >
                            ⌂ Full App
                        </button>
                    </div>
                );
            };

            // Render watch mode, navigation mode, or the full app
            if (watchMode) {
                return <WatchView />;
            }
            if (navMode) {
                return <NavigationView />;
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 p-4 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-0 z-10">
                        <div className="w-full md:w-auto">
                            <h1 className="text-xl font-bold text-white tracking-tight">Goats Dispatch</h1>
                            <p className="text-xs text-emerald-400 font-mono mt-1">Offline Ready • GPS Active</p>
                        </div>
                        
                        <div className="bg-slate-950 border border-slate-800 rounded-lg p-2.5 flex items-center justify-between w-full md:w-auto gap-4 shadow-inner">
                            <div className="pl-2">
                                <p className="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Route Miles</p>
                                <p className="text-xl font-mono text-white">{totalMileage.toFixed(2)} <span className="text-xs text-slate-500">mi</span></p>
                            </div>
                            <div className="border-l border-slate-800 pl-4 pr-2">
                                <p className="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Est. Deduction</p>
                                <p className="text-xl font-mono text-emerald-400">${taxDeduction}</p>
                            </div>
                            <button 
                                onClick={toggleTracking}
                                className={`ml-2 px-5 py-2.5 rounded-md text-xs font-bold transition shadow-lg ${isTracking ? 'bg-red-500/20 text-red-400 border border-red-500/50 animate-pulse' : 'bg-emerald-600 text-white hover:bg-emerald-500 border border-emerald-500'}`}
                            >
                                {isTracking ? 'STOP TRACKING' : 'START ROUTE'}
                            </button>
                            <button
                                onClick={() => setNavMode(true)}
                                className={`ml-2 px-4 py-2.5 rounded-md text-xs font-bold border transition ${routeList.length === 0 ? 'bg-slate-800 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-sky-500/15 border-sky-500/40 text-sky-300 hover:bg-sky-500/25'}`}
                                title="Start turn-by-turn navigation"
                                disabled={routeList.length === 0}
                            >
                                🧭 Navigate
                            </button>
                            <button
                                onClick={() => setWatchMode(v => !v)}
                                className={`ml-2 w-10 h-10 rounded-md text-base border transition flex items-center justify-center ${watchMode ? 'bg-emerald-500/20 border-emerald-500/50' : 'bg-slate-800 border-slate-700 hover:bg-slate-700'}`}
                                title="Toggle watch mode (also auto-enables on screens under 300px)"
                            >
                                ⌚
                            </button>
                        </div>
                    </header>

                    <div className="flex-grow p-4 md:p-6 flex flex-col lg:flex-row gap-6 max-w-7xl mx-auto w-full">
                        <div className="flex-grow bg-slate-900 rounded-xl border border-slate-800 p-4 shadow-xl overflow-y-auto">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wide">Property Database</h2>
                                <div className="flex items-center gap-2">
                                    <span className="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded-md">{jobs.length} Total</span>
                                    <button
                                        onClick={() => fileInputRef.current.click()}
                                        className="text-xs px-2.5 py-1.5 rounded-md bg-blue-500/10 border border-blue-500/30 text-blue-400 hover:bg-blue-500/20 transition font-medium"
                                        title="Import properties from CSV"
                                    >
                                        Import CSV
                                    </button>
                                    <button
                                        onClick={exportAllProperties}
                                        className="text-xs px-2.5 py-1.5 rounded-md bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition font-medium"
                                        title="Export all properties to CSV"
                                    >
                                        Export CSV
                                    </button>
                                    <button
                                        onClick={() => setShowMapsImport(v => !v)}
                                        className={`text-xs px-2.5 py-1.5 rounded-md border transition font-medium ${showMapsImport ? 'bg-sky-500/20 border-sky-500/50 text-sky-300' : 'bg-sky-500/10 border-sky-500/30 text-sky-400 hover:bg-sky-500/20'}`}
                                        title="Import locations from Google Maps or Apple Maps"
                                    >
                                        Maps
                                    </button>
                                </div>
                            </div>
                            {showMapsImport && (
                                <div className="mb-3 p-3 bg-slate-950 border border-slate-800 rounded-lg">
                                    <p className="text-[10px] text-sky-400 uppercase tracking-wider font-bold mb-2">Import from Maps</p>
                                    <p className="text-[10px] text-slate-500 mb-2">Paste a Google Maps or Apple Maps share link, or a saved-places JSON array. Locations are added to your property database.</p>
                                    <div className="flex gap-2">
                                        <input
                                            value={mapsLink}
                                            onChange={e => setMapsLink(e.target.value)}
                                            onKeyDown={e => { if (e.key === 'Enter') handleMapsImport(); }}
                                            placeholder="https://maps.apple.com/?ll=44.97,-93.26&q=…"
                                            className="flex-1 px-3 py-2 rounded-md bg-slate-900 border border-slate-700 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-sky-500"
                                        />
                                        <button
                                            onClick={handleMapsImport}
                                            disabled={!mapsLink.trim()}
                                            className={`text-xs px-3 py-2 rounded-md border transition font-bold ${!mapsLink.trim() ? 'bg-slate-800 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-sky-600 border-sky-500 text-white hover:bg-sky-500'}`}
                                        >
                                            Import
                                        </button>
                                    </div>
                                    {mapsStatus && (
                                        <div className={`mt-2 px-3 py-2 rounded-lg text-xs font-medium border ${mapsStatus.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : mapsStatus.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-blue-500/10 border-blue-500/30 text-blue-400'}`}>
                                            {mapsStatus.message}
                                        </div>
                                    )}
                                </div>
                            )}
                            <input
                                ref={fileInputRef}
                                type="file"
                                accept=".csv"
                                onChange={importCSV}
                                className="hidden"
                            />
                            {importStatus && (
                                <div className={`mb-3 px-3 py-2 rounded-lg text-xs font-medium border ${importStatus.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-red-500/10 border-red-500/30 text-red-400'}`}>
                                    {importStatus.message}
                                    <button onClick={() => setImportStatus(null)} className="ml-2 underline hover:no-underline">Dismiss</button>
                                </div>
                            )}
                            <div className="space-y-2">
                                {jobs.map(job => {
                                    const inRoute = routeList.some(r => r.id === job.id);
                                    return (
                                        <div key={job.id} className={`flex justify-between items-center p-3.5 border rounded-lg transition ${inRoute ? 'bg-emerald-950/20 border-emerald-900/50' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}`}>
                                            <div className="min-w-0">
                                                <p className="font-semibold text-slate-100 text-sm">{job.address}</p>
                                                <p className="text-xs text-slate-400 mt-0.5 truncate">{job.service}</p>
                                                {(() => {
                                                    const s = scheduleData.find(x => x.job.id === job.id);
                                                    if (!s || !s.freqDays) return null;
                                                    const badgeCls = s.status === 'overdue' ? 'bg-red-500/15 text-red-400 border-red-500/40'
                                                        : s.status === 'dueToday' ? 'bg-amber-500/15 text-amber-400 border-amber-500/40'
                                                        : s.status === 'thisWeek' ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/40'
                                                        : 'bg-slate-800 text-slate-500 border-slate-700';
                                                    const label = s.status === 'overdue' ? `Overdue ${s.daysOverdue}d`
                                                        : s.status === 'dueToday' ? 'Due today'
                                                        : `Due ${fmtShort(s.nextDue)}`;
                                                    return (
                                                        <span className={`inline-block mt-1 text-[9px] px-1.5 py-0.5 rounded border font-mono ${badgeCls}`}>
                                                            {label}
                                                        </span>
                                                    );
                                                })()}
                                            </div>
                                            <button 
                                                onClick={() => toggleJobInRoute(job)}
                                                className={`text-xs px-3 py-1.5 rounded-lg transition font-medium border ${inRoute ? 'bg-slate-900 border-slate-700 text-slate-400 hover:text-red-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20'}`}
                                            >
                                                {inRoute ? 'Remove' : '+ Route'}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="w-full lg:w-96 bg-slate-900 rounded-xl border border-slate-800 p-4 h-fit lg:sticky lg:top-24 shadow-xl">
                            {/* Tabs */}
                            <div className="flex border-b border-slate-800 mb-3 overflow-x-auto">
                                <button
                                    onClick={() => setRightTab('route')}
                                    className={`px-3 py-2 text-xs font-bold uppercase tracking-wide transition border-b-2 whitespace-nowrap ${rightTab === 'route' ? 'text-emerald-400 border-emerald-400' : 'text-slate-500 border-transparent hover:text-slate-300'}`}
                                >
                                    Route
                                </button>
                                <button
                                    onClick={() => setRightTab('map')}
                                    className={`px-3 py-2 text-xs font-bold uppercase tracking-wide transition border-b-2 whitespace-nowrap ${rightTab === 'map' ? 'text-emerald-400 border-emerald-400' : 'text-slate-500 border-transparent hover:text-slate-300'}`}
                                >
                                    Map
                                </button>
                                <button
                                    onClick={() => setRightTab('schedule')}
                                    className={`px-3 py-2 text-xs font-bold uppercase tracking-wide transition border-b-2 whitespace-nowrap ${rightTab === 'schedule' ? 'text-emerald-400 border-emerald-400' : 'text-slate-500 border-transparent hover:text-slate-300'}`}
                                >
                                    Schedule{dueCount > 0 ? ` (${dueCount})` : ''}
                                </button>
                                <button
                                    onClick={() => setRightTab('stats')}
                                    className={`px-3 py-2 text-xs font-bold uppercase tracking-wide transition border-b-2 whitespace-nowrap ${rightTab === 'stats' ? 'text-emerald-400 border-emerald-400' : 'text-slate-500 border-transparent hover:text-slate-300'}`}
                                >
                                    Stats
                                </button>
                                <button
                                    onClick={() => setRightTab('history')}
                                    className={`px-3 py-2 text-xs font-bold uppercase tracking-wide transition border-b-2 whitespace-nowrap ${rightTab === 'history' ? 'text-emerald-400 border-emerald-400' : 'text-slate-500 border-transparent hover:text-slate-300'}`}
                                >
                                    History ({completedToday} today)
                                </button>
                            </div>

                            {/* Route Tab */}
                            {rightTab === 'route' && (
                                <>
                                    {/* Optimize status */}
                                    {optimizeStatus && (
                                        <div className={`mb-3 px-3 py-2 rounded-lg text-xs font-medium border ${optimizeStatus.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : optimizeStatus.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-blue-500/10 border-blue-500/30 text-blue-400'}`}>
                                            {optimizeStatus.type === 'info' && <span className="inline-block animate-spin mr-1">⟳</span>}
                                            {optimizeStatus.message}
                                            <button onClick={() => setOptimizeStatus(null)} className="ml-2 underline hover:no-underline">Dismiss</button>
                                        </div>
                                    )}
                                    <div className="flex justify-end items-center mb-3 gap-2">
                                        <button
                                            onClick={optimizeRouteHandler}
                                            disabled={routeList.length < 2 || isOptimizing}
                                            className={`text-xs px-2.5 py-1.5 rounded-md border transition font-medium ${routeList.length < 2 || isOptimizing ? 'bg-slate-800 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-violet-500/10 border-violet-500/30 text-violet-400 hover:bg-violet-500/20'}`}
                                            title="Sort stops by proximity to minimize driving distance"
                                        >
                                            {isOptimizing ? 'Optimizing...' : 'Optimize Route'}
                                        </button>
                                        <span className="bg-emerald-500 text-slate-950 text-xs font-bold px-2 py-0.5 rounded-full">{routeList.length} Stops</span>
                                        <button
                                            onClick={() => setNavMode(true)}
                                            disabled={routeList.length === 0}
                                            className={`text-xs px-2.5 py-1.5 rounded-md border transition font-medium ${routeList.length === 0 ? 'bg-slate-800 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-sky-500/10 border-sky-500/30 text-sky-400 hover:bg-sky-500/20'}`}
                                            title="Start turn-by-turn navigation"
                                        >
                                            🧭 Navigate
                                        </button>
                                        <button
                                            onClick={exportRouteManifest}
                                            disabled={routeList.length === 0}
                                            className={`text-xs px-2.5 py-1.5 rounded-md border transition font-medium ${routeList.length === 0 ? 'bg-slate-800 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20'}`}
                                            title="Export route manifest to CSV"
                                        >
                                            Export Route
                                        </button>
                                    </div>
                                    <div className="space-y-2 mb-4 max-h-[60vh] overflow-y-auto pr-1">
                                        {routeList.map((job, idx) => (
                                            <div key={job.id} className="p-3 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-between group">
                                                <div className="flex items-center gap-3">
                                                    <span className="bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 font-bold px-2 py-0.5 rounded text-sm font-mono">#{idx + 1}</span>
                                                    <div>
                                                        <p className="font-semibold text-sm text-slate-200">{job.address}</p>
                                                        <p className="text-[10px] text-slate-500">{job.service}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-1.5">
                                                    <button
                                                        onClick={() => completeJob(job)}
                                                        className="text-[10px] px-2 py-1 rounded-md bg-emerald-600 text-white hover:bg-emerald-500 transition font-bold shadow"
                                                        title="Mark as completed"
                                                    >
                                                        Done
                                                    </button>
                                                    <button
                                                        onClick={() => toggleJobInRoute(job)}
                                                        className="text-[10px] px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-400 hover:text-red-400 transition font-medium"
                                                        title="Remove from route"
                                                    >
                                                        Remove
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                        {routeList.length === 0 && (
                                            <div className="text-center py-12 border border-dashed border-slate-800 rounded-lg">
                                                <p className="text-xs text-slate-500">No properties queued.</p>
                                                <p className="text-[10px] text-slate-600 mt-1">Select properties from the database to build your route.</p>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}

                            {/* Map Tab */}
                            {rightTab === 'map' && (
                                <div className="-mx-4 -mt-3">
                                    <MapView route={routeList} gpsPos={gpsPosition} geocodeCache={geocodeCache} onAddFromMap={handleAddFromMap} />
                                </div>
                            )}

                            {/* Schedule Tab */}
                            {rightTab === 'schedule' && (
                                <div className="space-y-1 max-h-[70vh] overflow-y-auto pr-1">
                                    <ScheduleView />
                                </div>
                            )}

                            {/* Stats Tab */}
                            {rightTab === 'stats' && (
                                <div className="space-y-1 max-h-[70vh] overflow-y-auto pr-1">
                                    <StatsView />
                                </div>
                            )}

                            {/* History Tab */}
                            {rightTab === 'history' && (
                                <div className="space-y-2 mb-4 max-h-[60vh] overflow-y-auto pr-1">
                                    {(() => {
                                        const jobsWithHistory = jobs
                                            .filter(j => j.completedHistory && j.completedHistory.length > 0)
                                            .sort((a, b) => {
                                                const aLast = a.completedHistory[a.completedHistory.length - 1].timestamp;
                                                const bLast = b.completedHistory[b.completedHistory.length - 1].timestamp;
                                                return bLast - aLast;
                                            });
                                        if (jobsWithHistory.length === 0) {
                                            return (
                                                <div className="text-center py-12 border border-dashed border-slate-800 rounded-lg">
                                                    <p className="text-xs text-slate-500">No completion history yet.</p>
                                                    <p className="text-[10px] text-slate-600 mt-1">Mark jobs as done from the Route tab to track completions.</p>
                                                </div>
                                            );
                                        }
                                        return jobsWithHistory.map(job => {
                                            const lastCompletion = job.completedHistory[job.completedHistory.length - 1];
                                            const isToday = lastCompletion.date === todayStr;
                                            return (
                                                <div key={job.id} className={`p-3 rounded-lg border ${isToday ? 'bg-emerald-950/20 border-emerald-900/50' : 'bg-slate-950 border-slate-800'}`}>
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-emerald-400">✓</span>
                                                            <div>
                                                                <p className="font-semibold text-sm text-slate-200">{job.address}</p>
                                                                <p className="text-[10px] text-slate-500">{job.service} • {job.completedHistory.length} completion{job.completedHistory.length > 1 ? 's' : ''}</p>
                                                            </div>
                                                        </div>
                                                        <button
                                                            onClick={() => undoLastCompletion(job)}
                                                            className="text-[10px] px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-400 hover:text-amber-400 hover:border-amber-500/30 transition font-medium"
                                                            title="Undo last completion"
                                                        >
                                                            Undo
                                                        </button>
                                                    </div>
                                                    <div className="mt-2 flex flex-wrap gap-1">
                                                        {job.completedHistory.slice(-5).reverse().map((h, i) => (
                                                            <span key={i} className={`text-[9px] px-1.5 py-0.5 rounded font-mono ${h.date === todayStr ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-500'}`}>
                                                                {h.date}
                                                            </span>
                                                        ))}
                                                        {job.completedHistory.length > 5 && (
                                                            <span className="text-[9px] text-slate-600">+{job.completedHistory.length - 5} more</span>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        });
                                    })()}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
